<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prédio IA — escritório virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e2236;--panel:#2a2f4a;--panel2:#343a5c;--ink:#f1f2fa;--muted:#a3a9c7;--accent:#6c8cff;--line:#454c75}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas#view{display:block;position:fixed;inset:0;cursor:grab}
canvas#view.drag{cursor:grabbing}
canvas#view.hover{cursor:pointer}
.px{font-family:"Press Start 2P",monospace;letter-spacing:.5px}
.panel{position:fixed;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.35)}
#top{top:14px;left:14px;padding:10px 14px}
#top h1{margin:0;font-size:13px}
#top p{margin:6px 0 0;font-size:11px;color:var(--muted)}
#floorTitle{top:14px;left:50%;transform:translateX(-50%);padding:8px 10px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 28px)}
#floorTitle .t{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#floorTitle .s{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#floorTitle .sw{width:10px;height:28px;border-radius:3px;flex:none}
#tools{top:14px;right:14px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:440px}
button{border:2px solid var(--line);border-radius:8px;padding:7px 10px;font:600 12px system-ui;background:var(--panel2);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
button:hover{filter:brightness(1.15)}
button:active{transform:translateY(2px);box-shadow:none}
button.primary{background:var(--accent);border-color:#8aa3ff;color:#fff}
button.danger{background:#5c2b3a;border-color:#8a3d52}
#building{top:96px;left:14px;width:230px;padding:10px;max-height:calc(100% - 190px);overflow:auto}
#building .bh{font-size:10px;color:var(--muted);margin:2px 2px 8px}
#floorsList{display:flex;flex-direction:column;gap:5px;position:relative;padding-right:22px}
.fl{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;background:var(--panel2);cursor:pointer;border:2px solid transparent;position:relative}
.fl:hover{filter:brightness(1.12)}
.fl.cur{border-color:#fff}
.fl .num{font-size:9px;width:22px;color:var(--muted)}
.fl .sw{width:6px;align-self:stretch;border-radius:3px}
.fl .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.fl .pips{display:flex;gap:3px}
.fl .pips i{width:7px;height:7px;border-radius:2px}
.fl.link{animation:pulse 1s infinite}
.fl.obra{background:repeating-linear-gradient(45deg,#f2b000 0 10px,#2a2f4a 10px 20px)}
.fl.obra .nm{background:var(--panel);padding:2px 4px;border-radius:4px}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--lc,#6c8cff)}}
#shaft{position:absolute;top:0;bottom:0;right:2px;width:14px;border-radius:6px;background:repeating-linear-gradient(#3b4166 0 4px,#30365a 4px 8px)}
.td{position:absolute;left:2px;width:10px;height:10px;border-radius:3px;border:2px solid #fff;transition:none}
.legend{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;flex:none}
#agent{right:14px;top:78px;width:300px;padding:14px;display:none}
#agent .hd{display:flex;align-items:center;gap:10px}
#agent .hd .sw{width:8px;height:30px;border-radius:3px}
#agent .hd small{display:block;font-size:9px;color:var(--muted);margin-bottom:4px}
#agent .hd button{margin-left:auto;padding:3px 8px}
#agent h3{margin:12px 0 8px;font-size:15px}
.st{display:inline-flex;align-items:center;gap:6px;font:700 12px system-ui;padding:4px 8px;border-radius:6px;background:var(--panel2)}
.st i{width:8px;height:8px;border-radius:2px}
#agent .act{margin:10px 0;font:12px ui-monospace,Consolas,monospace;background:#151829;color:#b9f5cf;padding:9px 10px;border-radius:8px;border:2px solid #0e101c}
.msgs{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.msgs small{color:var(--muted);font-size:9px}
.msg{font-size:13px;padding:7px 10px;border-radius:10px;max-width:88%}
.msg.u{align-self:flex-end;background:var(--accent)}
.msg.a{align-self:flex-start;background:var(--panel2)}
.row{display:flex;gap:8px;flex-wrap:wrap}
#cmd{left:50%;bottom:14px;transform:translateX(-50%);width:min(720px,calc(100% - 28px));padding:8px;display:flex;gap:8px;align-items:center}
#cmd input{flex:1;min-width:0;border:2px solid var(--line);background:#151829;color:var(--ink);border-radius:8px;padding:10px 12px;font:14px system-ui;outline:none}
#cmd input:focus{border-color:var(--accent)}
#cmd .tag{font-size:9px;color:#fff;background:#151829;border-radius:6px;padding:8px}
#zoom{right:14px;bottom:84px;padding:6px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:36px;padding:6px 0;font-size:16px}
#overlay{position:fixed;inset:0;background:rgba(8,10,20,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
.dialog{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;width:min(470px,100%);box-shadow:0 8px 0 rgba(0,0,0,.3)}
.dialog h2{margin:0 0 14px;font-size:12px;line-height:1.6}
.dialog .body{font-size:14px;line-height:1.5}
.dialog .quote{background:#151829;border-radius:8px;padding:10px}
.dialog label{display:block;font-size:9px;color:var(--muted);margin-top:12px}
.dialog select{width:100%;padding:9px;border-radius:8px;border:2px solid var(--line);background:#151829;color:var(--ink);font:14px system-ui;margin-top:6px}
.dialog .seg{display:flex;gap:6px;margin-top:6px}
.dialog .seg button{flex:1}
.dialog .seg button.on{background:var(--accent);border-color:#8aa3ff}
.dialog .hint{font-size:12px;color:var(--muted);margin-top:8px}
.dialog ol{padding-left:20px;margin:10px 0}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.log{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.log div{font-size:13px;background:var(--panel2);border-radius:8px;padding:7px 10px}
.log time{color:var(--muted);font-size:11px;margin-right:6px}
#toasts{position:fixed;right:64px;bottom:84px;display:flex;flex-direction:column;gap:8px;width:min(320px,calc(100% - 80px));z-index:5}
.toast{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:11px 13px;box-shadow:0 5px 0 rgba(0,0,0,.25);font-size:13px;line-height:1.45;animation:in .25s ease}
.toast b{display:block;margin-bottom:3px}
.toast .row{margin-top:8px}
.toast button{padding:5px 9px;font-size:12px}
.toast .dim{color:var(--muted)}
@keyframes in{from{transform:translateY(10px);opacity:0}}
@media (max-width:860px){#building,#top{display:none}#agent{left:14px;right:14px;width:auto;top:auto;bottom:80px}#tools{top:auto;bottom:80px;left:14px;right:auto}#zoom{display:none}#floorTitle{top:14px}}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="top" class="panel"><h1 class="px">PRÉDIO IA</h1><p>Protótipo · dados de exemplo</p></div>
<div id="floorTitle" class="panel">
  <button id="fDown" title="Andar de baixo">▼</button>
  <span class="sw" id="ftSw"></span>
  <div style="min-width:0"><div class="t px" id="ftName"></div><div class="s" id="ftSpec"></div></div>
  <button id="fUp" title="Andar de cima">▲</button>
</div>
<div id="tools" class="panel">
  <button id="bNight">🌙 Dia/Noite</button>
  <button id="bLog">📖 Registro</button>
  <button id="bBuild" class="primary">＋ Simular pasta nova</button>
</div>
<div id="building" class="panel">
  <div class="bh px">PRÉDIO</div>
  <div id="floorsList"></div>
  <div class="legend" id="legend"></div>
</div>
<div id="agent" class="panel"></div>
<div id="zoom" class="panel"><button id="zIn">＋</button><button id="zOut">－</button></div>
<div id="cmd" class="panel">
  <span class="tag px">CMD</span>
  <input id="cmdIn" placeholder='Ex: "Skills, ajude a Conteudo-May a criar uma skill de posts"' autocomplete="off">
  <button id="cmdGo" class="primary">Enviar</button>
</div>
<div id="toasts"></div>
<div id="overlay"><div class="dialog" id="dialog"></div></div>

<script type="module">
try { await document.fonts.load('8px "Press Start 2P"'); } catch (e) {}

// ================= constantes =================
const T = 16, MW = 40, MH = 26;
const ELEV = { x: 22 * T, y: 2 * T + 10 };
const SPAWN = { x: 20 * T, y: 24 * T + 8 };
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const to = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((to - r) * p + r); g = Math.round((to - g) * p + g); b = Math.round((to - b) * p + b);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

// ================= dados de exemplo =================
const STATES = {
  typing:   { label: '✍️ Escrevendo',     color: '#6c8cff', actions: ['Editando roteiros/semana-46.md', 'Escrevendo src/app.tsx', 'Criando SKILL.md', 'Ajustando estilos.css', 'Escrevendo legendas.md'] },
  reading:  { label: '📖 Lendo',          color: '#b07bff', actions: ['Lendo briefing-cliente.pdf', 'Buscando "hashtags" no projeto', 'Lendo README.md', 'Analisando dados.csv'] },
  terminal: { label: '⌨️ Terminal',       color: '#2fd08a', actions: ['Rodando npm test', 'git status', 'python gerar_posts.py', 'npm run build'] },
  waiting:  { label: '❗ Esperando você', color: '#ffc233', actions: ['Esperando sua aprovação', 'Pergunta: posso publicar?', 'Precisa de uma decisão sua'] },
  idle:     { label: '☕ Pausa',           color: '#8a90ad', actions: ['Parado há 6 min — café na copa'] },
};
const COMPANIES = [
  { name: 'Anti', color: '#2fb07f', spec: 'Automação e scripts', kw: ['automa', 'script', 'python', 'dados', 'planilha', 'backup'],
    seed: [{ title: 'Script de backup diário', state: 'terminal' }, { title: 'Limpeza da planilha de leads', state: 'reading' }] },
  { name: 'Skills', color: '#5b7cff', spec: 'Cria e organiza skills do Claude', kw: ['skill', 'agente', 'claude', 'prompt', 'organiz'],
    seed: [{ title: 'Skill de posts para Instagram', state: 'typing' }, { title: 'Revisão das skills antigas', state: 'reading' }] },
  { name: 'Conteudo-May', color: '#ff7a59', spec: 'Conteúdo e redes sociais', kw: ['post', 'conteúdo', 'conteudo', 'instagram', 'reels', 'legenda', 'roteiro'],
    seed: [{ title: 'Roteiro dos reels da semana', state: 'typing' }, { title: 'Legendas do Instagram', state: 'reading' }, { title: 'Calendário editorial', state: 'waiting' }] },
];
const NEW_PROJECTS = [['Loja-Online', '#e85d9a'], ['App-Fitness', '#e0a400'], ['Agencia-X', '#00a8c0'], ['Financas', '#8e6bff']];
let newIdx = 0;
const logbook = [];
const log = text => logbook.unshift({ time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }), text });

// ================= sprites =================
function outline(c) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a);
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && a[(y * w + x) * 4 + 3] > 40;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (a[i + 3] > 40) continue;
    if (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1)) { o[i] = 34; o[i + 1] = 28; o[i + 2] = 48; o[i + 3] = 255; }
  }
  d.data.set(o); g.putImageData(d, 0, 0);
}
function makeSprite(w, h, draw, ol = true) {
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const g = c.getContext('2d'); g.translate(1, 1);
  draw(g, (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); });
  if (ol) outline(c);
  return c;
}

const SKINS = ['#f6d0b1', '#e8b48f', '#c98d63', '#8f5b3c', '#fbe0c8'];
const HAIRS = ['#2b1d14', '#5a3a22', '#e0a85c', '#1b1b22', '#9c3b2b', '#d8d2c8', '#4a3a8c'];
const PANTS = ['#2e3a59', '#3d3d46', '#4b5a6b', '#5b4636', '#2f4a3a'];
let lookId = 0;
const newLook = shirt => ({ id: lookId++, shirt, skin: pick(SKINS), hair: pick(HAIRS), pants: pick(PANTS), style: Math.floor(Math.random() * 3) });
const spriteCache = new Map();
function avatarSprite(L, dir, frame) {
  const key = L.id + dir + frame;
  if (spriteCache.has(key)) return spriteCache.get(key);
  const s = makeSprite(20, 28, (g, R) => {
    if (dir === 'right') { g.translate(20, 0); g.scale(-1, 1); }
    const d = dir === 'right' ? 'left' : dir;
    const la = frame === 1 ? -1 : 0, lb = frame === 2 ? -1 : 0, am = frame === 1 ? 1 : frame === 2 ? -1 : 0;
    const SH = '#2b2b33', EY = '#1d1d2b', arm = shade(L.shirt, -0.14);
    if (d === 'down' || d === 'up') {
      R(6, 20 + la, 3, 5, L.pants); R(11, 20 + lb, 3, 5, L.pants); R(6, 24 + la, 3, 2, SH); R(11, 24 + lb, 3, 2, SH);
      R(5, 13, 10, 8, L.shirt); g.clearRect(5, 13, 1, 1); g.clearRect(14, 13, 1, 1);
      R(3, 14 + am, 2, 5, arm); R(15, 14 - am, 2, 5, arm); R(3, 19 + am, 2, 1, L.skin); R(15, 19 - am, 2, 1, L.skin);
      R(5, 4, 10, 9, L.skin); [[5, 4], [14, 4], [5, 12], [14, 12]].forEach(([x, y]) => g.clearRect(x, y, 1, 1));
      if (d === 'down') {
        R(5, 3, 10, 3, L.hair); R(6, 2, 8, 1, L.hair); R(5, 6, 1, 3, L.hair); R(14, 6, 1, 3, L.hair);
        if (L.style === 1) { R(4, 5, 1, 9, L.hair); R(15, 5, 1, 9, L.hair); }
        if (L.style === 2) R(8, 0, 4, 2, L.hair);
        R(7, 8, 1, 2, EY); R(12, 8, 1, 2, EY); R(6, 10, 1, 1, '#f2a0a0'); R(13, 10, 1, 1, '#f2a0a0');
        R(9, 13, 2, 1, shade(L.shirt, 0.25));
      } else {
        R(5, 3, 10, 9, L.hair); R(6, 2, 8, 1, L.hair);
        if (L.style === 1) R(5, 12, 10, 3, L.hair);
        if (L.style === 2) R(8, 0, 4, 2, L.hair);
      }
    } else {
      R(7, 20 + la, 3, 5, L.pants); R(10, 20 + lb, 3, 5, L.pants); R(6, 24 + la, 4, 2, SH); R(9, 24 + lb, 4, 2, SH);
      R(6, 13, 8, 8, L.shirt);
      R(9 + am, 14, 3, 5, arm); R(9 + am, 19, 3, 1, L.skin);
      R(5, 4, 9, 9, L.skin); [[5, 4], [13, 4], [5, 12], [13, 12]].forEach(([x, y]) => g.clearRect(x, y, 1, 1));
      R(5, 3, 9, 3, L.hair); R(6, 2, 7, 1, L.hair); R(10, 3, 4, 7, L.hair);
      if (L.style === 1) R(11, 6, 3, 9, L.hair);
      if (L.style === 2) R(12, 1, 3, 3, L.hair);
      R(6, 8, 1, 2, EY); R(6, 10, 1, 1, '#f2a0a0');
    }
  });
  spriteCache.set(key, s);
  return s;
}
const bubbleSpr = makeSprite(11, 13, (g, R) => { R(1, 0, 9, 10, '#ffd23f'); R(0, 1, 11, 8, '#ffd23f'); R(4, 10, 3, 2, '#ffd23f'); R(5, 11, 1, 2, '#ffd23f'); R(4, 2, 3, 4, '#1d2433'); R(4, 7, 3, 2, '#1d2433'); });
const arrowSpr = makeSprite(7, 4, (g, R) => { R(0, 0, 7, 1, '#ffffff'); R(1, 1, 5, 1, '#ffffff'); R(2, 2, 3, 1, '#ffffff'); R(3, 3, 1, 1, '#ffffff'); });

// móveis
const deskSpr = makeSprite(34, 22, (g, R) => {
  R(0, 4, 34, 11, '#e8d3ae'); R(0, 4, 34, 1, '#f6e8cc'); R(0, 15, 34, 5, '#b48b5e'); R(1, 20, 3, 2, '#8a6a48'); R(30, 20, 3, 2, '#8a6a48');
  R(11, 0, 12, 8, '#5a6175'); R(11, 0, 12, 1, '#7b839a'); R(16, 3, 2, 2, '#9aa2b8'); R(10, 8, 14, 2, '#b8bdc9');
  R(2, 6, 7, 6, '#ffffff'); R(3, 8, 5, 1, '#c9cfdb'); R(3, 10, 4, 1, '#c9cfdb');
  R(27, 7, 4, 4, '#e85d5d'); R(31, 8, 1, 2, '#e85d5d');
});
const plantSpr = makeSprite(16, 24, (g, R) => {
  R(4, 16, 8, 7, '#c56b45'); R(3, 15, 10, 2, '#da8257'); R(5, 17, 2, 5, '#d77d55');
  R(5, 5, 6, 11, '#3f8c4a'); R(2, 8, 5, 6, '#4f9c52'); R(9, 6, 5, 7, '#4f9c52'); R(6, 1, 4, 6, '#5fae5a'); R(1, 11, 4, 3, '#5fae5a'); R(11, 10, 4, 4, '#5fae5a');
  R(7, 2, 2, 2, '#86d07a'); R(3, 9, 2, 2, '#86d07a'); R(10, 7, 2, 2, '#86d07a');
});
const sofaSpr = (color, up) => makeSprite(64, 22, (g, R) => {
  const dk = shade(color, -0.18);
  if (!up) { R(0, 0, 64, 9, dk); R(0, 8, 64, 11, color); R(0, 3, 7, 17, dk); R(57, 3, 7, 17, dk); R(21, 9, 1, 9, dk); R(42, 9, 1, 9, dk); R(0, 19, 64, 3, shade(color, -0.35)); }
  else { R(0, 13, 64, 9, dk); R(0, 3, 64, 11, color); R(0, 1, 7, 18, dk); R(57, 1, 7, 18, dk); R(21, 4, 1, 9, dk); R(42, 4, 1, 9, dk); R(0, 0, 64, 2, shade(color, 0.15)); }
});
const coffeeTableSpr = makeSprite(32, 14, (g, R) => { R(0, 0, 32, 9, '#a87850'); R(0, 0, 32, 1, '#c4936a'); R(0, 9, 32, 3, '#7d5839'); R(1, 12, 2, 2, '#5e432c'); R(29, 12, 2, 2, '#5e432c'); R(6, 3, 6, 4, '#f4f4f4'); R(20, 2, 4, 4, '#ffd166'); });
const bookshelfSpr = makeSprite(32, 34, (g, R) => {
  R(0, 0, 32, 34, '#8a6448'); R(2, 2, 28, 30, '#6d4d36');
  const cols = ['#e85d5d', '#5b7cff', '#ffd166', '#2fb07f', '#b07bff', '#ff9f7a'];
  for (let s = 0; s < 3; s++) { R(2, 11 + s * 10, 28, 1, '#8a6448'); for (let b = 0; b < 6; b++) R(3 + b * 4 + (s % 2), 3 + s * 10, 3, 8 - (b % 3), cols[(b + s * 2) % 6]); }
});
const counterSpr = makeSprite(128, 22, (g, R) => {
  R(0, 0, 128, 7, '#ddd3c5'); R(0, 0, 128, 1, '#efe7dc'); R(0, 7, 128, 15, '#bfae97');
  for (let i = 0; i < 8; i++) { R(i * 16, 9, 1, 11, '#a8977f'); R(i * 16 + 7, 13, 2, 1, '#6d6150'); }
  R(20, 1, 16, 5, '#a9b9c8'); R(21, 2, 14, 3, '#8ea1b3'); R(27, 0, 2, 2, '#c9d2dc');
  R(80, 1, 10, 5, '#fafafa'); R(92, 2, 6, 4, '#e85d5d');

function drawDeskDyn(ctx, d, t) {
  const o = d.guest || d.owner;
  if (!o || o.seat !== d || o.mode !== 'sit') return;
  const x0 = d.c * T - 1, y0 = d.r * T - 6, col = STATES[o.state].color;
  ctx.globalAlpha = 0.45 + Math.sin(t * 6) * 0.2; ctx.fillStyle = col; ctx.fillRect(x0 + 10, y0 - 3, 14, 2); ctx.globalAlpha = 1;
  ctx.fillRect(x0 + 11, y0 - 1, 12, 1);
  ctx.fillStyle = o.look.skin;
  if (o.state === 'typing' || o.state === 'terminal') {
    const k = Math.floor(t * (o.state === 'terminal' ? 16 : 9)) % 2;
    ctx.fillRect(x0 + 7, y0 + 9 + k, 3, 2); ctx.fillRect(x0 + 24, y0 + 10 - k, 3, 2);
  } else if (o.state === 'reading') {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x0 + 10, y0 + 6, 14, 8); ctx.fillStyle = '#c9cfdb'; ctx.fillRect(x0 + 12, y0 + 8, 9, 1); ctx.fillRect(x0 + 12, y0 + 10, 7, 1);
    ctx.fillStyle = o.look.skin; ctx.fillRect(x0 + 8, y0 + 9, 3, 2); ctx.fillRect(x0 + 23, y0 + 9, 3, 2);
  } else { ctx.fillRect(x0 + 8, y0 + 10, 3, 2); ctx.fillRect(x0 + 23, y0 + 10, 3, 2); }
}

// ================= pathfinding =================
function findPath(fl, x0, y0, x1, y1) {
  const tile = (x, y) => [Math.max(0, Math.min(MW - 1, Math.floor(x / T))), Math.max(0, Math.min(MH - 1, Math.floor(y / T)))];
  const [sc, sr] = tile(x0, y0); let [gc, gr] = tile(x1, y1);
  const free = (c, r) => c >= 0 && r >= 0 && c < MW && r < MH && !fl.blocked[r * MW + c];
  if (!free(gc, gr)) { outer: for (let rad = 1; rad < 4; rad++) for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) if (free(gc + dx, gr + dy)) { gc += dx; gr += dy; break outer; } }
  const prev = new Int32Array(MW * MH).fill(-1), start = sr * MW + sc, goal = gr * MW + gc;
  const q = [start]; prev[start] = start;
  while (q.length) {
    const cur = q.shift(); if (cur === goal) break;
    const c = cur % MW, r = (cur / MW) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dx, nr = r + dy, n = nr * MW + nc;
      if (free(nc, nr) && prev[n] === -1) { prev[n] = cur; q.push(n); }
    }
  }
  if (prev[goal] === -1) return [{ x: x1, y: y1 }];
  const pts = [];
  for (let n = goal; n !== start; n = prev[n]) pts.unshift({ x: (n % MW) * T + 8, y: ((n / MW) | 0) * T + 8 });
  pts.push({ x: x1, y: y1 });
  return pts;
}

// ================= agentes =================
const agents = [];
class Agent {
  constructor(company, seed, desk, spawnInLobby = false) {
    Object.assign(this, { company, title: seed.title, state: seed.state, action: seed.action || pick(STATES[seed.state].actions) });
    this.msgs = [{ u: true, t: seed.title + ' — pode começar?' }, { u: false, t: 'Claro! Já estou trabalhando nisso.' }];
    this.look = newLook(company.color);
    this.home = desk; desk.owner = this;
    this.homeFloor = company.floor.f; this.floor = this.homeFloor;
    this.mode = 'sit'; this.dir = 'down'; this.path = []; this.speed = 52;
    this.busy = false; this.collab = false; this.consulting = false; this.cancel = false; this.carry = null; this.seat = null; this.coffee = null;
    this.t = Math.random() * 10; this.next = 5 + Math.random() * 10; this.transit = null; this.x = 0; this.y = 0;
    agents.push(this);
    if (spawnInLobby) { this.floor = 0; this.mode = 'stand'; this.dir = 'up'; this.x = SPAWN.x; this.y = SPAWN.y; }
    else this.sitAt(desk);
  }
  setState(s, action) { this.state = s; this.action = action || pick(STATES[s].actions); }
  setAction(a) { this.action = a; }
  sitAt(desk) { this.seat = desk; this.mode = 'sit'; this.dir = 'down'; this.x = desk.sx; this.y = desk.sy; }
  standUp() { if (this.mode === 'sit') { this.mode = 'stand'; this.seat = null; this.y += 6; } }
  walkTo(x, y) {
    this.standUp();
    const pts = findPath(floors[this.floor], this.x, this.y, x, y);
    this.mode = 'walk'; this.path = pts;
    return new Promise(res => { this._res = res; });
  }
  async tick(dt) {
    if (this.busy || this.collab || this.floor === null) return;
    if ((this.next -= dt) > 0) return;
    this.next = 7 + Math.random() * 10;
    const r = Math.random(), s = r < 0.32 ? 'typing' : r < 0.55 ? 'reading' : r < 0.75 ? 'terminal' : r < 0.85 ? 'waiting' : 'idle';
    if (s === this.state) return;
    const fl = floors[this.floor];
    if (s === 'idle') {
      const spot = fl.coffee.find(c => !c.by); if (!spot) return;
      this.busy = true; spot.by = this; this.coffee = spot; this.setState('idle', 'Indo tomar um café');
      await this.walkTo(spot.x, spot.y); this.dir = spot.dir; this.setState('idle'); this.busy = false;
    } else if (this.state === 'idle') {
      this.busy = true; if (this.coffee) { this.coffee.by = null; this.coffee = null; }
      this.setState(s, 'Voltando para a mesa');
      await this.walkTo(this.home.sx, this.home.sy); this.sitAt(this.home); this.setState(s); this.busy = false;
    } else this.setState(s);
  }
  update(dt) {
    this.t += dt;
    if (!this.path.length) return;
    const p = this.path[0], dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy), step = this.speed * dt;
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) this.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (d <= step) { this.x = p.x; this.y = p.y; this.path.shift(); if (!this.path.length) { this.mode = 'stand'; const r = this._res; this._res = null; r && r(); } }
    else { this.x += (dx / d) * step; this.y += (dy / d) * step; }
  }
  draw(ctx, t) {
    const x = Math.round(this.x), y = Math.round(this.y), sit = this.mode === 'sit';
    const frame = this.mode === 'walk' ? (Math.floor(this.t * 8) % 2) + 1 : 0;
    if (!sit) { ctx.fillStyle = 'rgba(20,15,35,.25)'; ctx.fillRect(x - 6, y - 1, 12, 3); ctx.fillRect(x - 4, y - 2, 8, 5); }
    ctx.drawImage(avatarSprite(this.look, sit ? 'down' : this.dir, frame), x - 11, y - 27 + (sit ? 3 : 0));
    if (this.mode === 'stand' && this.state === 'idle' && !this.collab && !this.carry) {
      const hx = this.dir === 'left' ? x - 3 : this.dir === 'right' ? x + 1 : x + 4;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(hx, y - 10, 3, 3); ctx.fillStyle = '#6b4a33'; ctx.fillRect(hx, y - 10, 3, 1);
      ctx.fillStyle = 'rgba(255,255,255,.6)'; const p = (t * 0.7) % 1; ctx.fillRect(hx + 1 + Math.round(Math.sin(p * 7)), y - 12 - Math.round(p * 6), 1, 1);
    }
    if (this.carry) {
      const cx = x + 3, cy = y - 12;
      ctx.fillStyle = '#221c30'; ctx.fillRect(cx - 1, cy - 1, 9, 7);
      ctx.fillStyle = this.carry === 'envelope' ? '#fff3d1' : this.company.color; ctx.fillRect(cx, cy, 7, 5);
      if (this.carry === 'envelope') { ctx.fillStyle = '#d9c79c'; ctx.fillRect(cx + 1, cy + 1, 5, 1); }
    }
  }
}

// ================= viagens =================
async function travel(a, to, dest) {
  a.standUp();
  if (a.floor !== to) {
    await a.walkTo(ELEV.x, ELEV.y);
    a.dir = 'up'; floors[a.floor].door = performance.now() + 900; await wait(350);
    const from = a.floor; a.floor = null;
    a.transit = { from, to, t0: performance.now(), dur: 900 + Math.abs(to - from) * 450 };
    await wait(a.transit.dur);
    a.transit = null; a.floor = to; a.x = ELEV.x; a.y = ELEV.y; a.dir = 'down';
    floors[to].door = performance.now() + 900; await wait(300);
  }

}

// ================= câmera / render =================
const cv = $('view'), ctx = cv.getContext('2d');
const lightCv = document.createElement('canvas'), lg = lightCv.getContext('2d');
let view = 1, night = false, fade = 0, follow = null, selected = null;
const cam = { x: MW * T / 2, y: MH * T / 2, z: 2.5 };
let dpr = 1;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);

  lightCv.width = cv.width; lightCv.height = cv.height;
}
resize(); addEventListener('resize', resize);
const fitZoom = () => Math.max(1.2, Math.min(innerWidth / (MW * T), innerHeight / (MH * T)) * 0.92);
cam.z = fitZoom();
const offset = () => ({ ox: innerWidth / 2 - cam.x * cam.z, oy: innerHeight / 2 - cam.y * cam.z });
const toWorld = (sx, sy) => { const { ox, oy } = offset(); return { x: (sx - ox) / cam.z, y: (sy - oy) / cam.z }; };

function drawWindows(fl, t) {
  for (const w of fl.windows) {
    ctx.fillStyle = night ? '#1b2550' : '#9fd3ff'; ctx.fillRect(w.x, w.y, w.w, w.h);
    if (night) { ctx.fillStyle = '#fff6c8'; for (let i = 0; i < 5; i++) if (Math.sin(t * 2 + i * 3 + w.x) > -0.6) ctx.fillRect(w.x + ((i * 37 + w.x) % (w.w - 2)) + 1, w.y + ((i * 13) % (w.h - 3)) + 1, 1, 1); }
    else { ctx.fillStyle = '#ffffff'; const cx = w.x + ((t * 3 + w.x) % (w.w + 16)) - 8; ctx.fillRect(Math.max(w.x, cx), w.y + 4, Math.max(0, Math.min(10, w.x + w.w - cx)), 3); }
    ctx.fillStyle = '#8e7f6c'; ctx.fillRect(w.x + w.w / 2 - 1, w.y, 2, w.h); ctx.fillRect(w.x, w.y + w.h / 2 - 1, w.w, 1);
  }
  if (fl.door > performance.now()) { ctx.fillStyle = '#2a2d3a'; ctx.fillRect(21 * T + 4, 8, 2 * T - 8, 24); ctx.fillStyle = '#ffe9a8'; ctx.fillRect(21 * T + 6, 10, 2 * T - 12, 2); }
  if (fl.lobby) {
    // diretório das empresas no hall
    const x = 28 * T + 8, list = floors.filter(f => !f.lobby).slice().reverse().slice(0, 6);
    ctx.fillStyle = '#2a2f4a'; ctx.fillRect(x - 2, 4, 8 * T + 4, 2);
  }
}

function render(t) {
  const fl = floors[view], z = cam.z;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = night ? '#121530' : '#262a42'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  let { ox, oy } = offset(); ox = Math.round(ox * dpr) / dpr; oy = Math.round(oy * dpr) / dpr;
  ctx.setTransform(dpr * z, 0, 0, dpr * z, ox * dpr, oy * dpr);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(fl.cv, 0, 0);
  drawWindows(fl, t);
  const items = fl.ents.map(e => ({ s: e.sortY, e }));
  agents.forEach(a => { if (a.floor === view) items.push({ s: a.y + (a.mode === 'sit' ? 0 : 0.5), a }); });
  if (fl.lobby) items.push({ s: recep.y, r: true });
  items.sort((p, q) => p.s - q.s);
  for (const it of items) {
    if (it.e) { ctx.drawImage(it.e.img, it.e.x - 1, it.e.y - 1); it.e.dyn && it.e.dyn(ctx, t); }
    else if (it.a) it.a.draw(ctx, t);
    else ctx.drawImage(avatarSprite(recep.look, 'down', 0), recep.x - 11, recep.y - 24);
  }
  // bolhas e seleção por cima
  for (const a of agents) {
    if (a.floor !== view) continue;
    const top = Math.round(a.y) - 27 + (a.mode === 'sit' ? 3 : 0);
    if (a.state === 'waiting' && a.mode === 'sit') ctx.drawImage(bubbleSpr, Math.round(a.x) - 6, top - 15 + Math.round(Math.sin(t * 4) * 1.5));
    if (a === selected) ctx.drawImage(arrowSpr, Math.round(a.x) - 4, top - (a.state === 'waiting' && a.mode === 'sit' ? 22 : 8) + Math.round(Math.sin(t * 5) * 1.5));
  }
  // luz noturna
  if (night) {
    lg.setTransform(1, 0, 0, 1, 0, 0); lg.globalCompositeOperation = 'source-over';
    lg.clearRect(0, 0, lightCv.width, lightCv.height); lg.fillStyle = 'rgba(10,14,44,0.62)'; lg.fillRect(0, 0, lightCv.width, lightCv.height);
    lg.globalCompositeOperation = 'destination-out';
    const hole = (wx, wy, r, k = 0.95) => { const sx = (ox + wx * z) * dpr, sy = (oy + wy * z) * dpr, rr = r * z * dpr; const gr = lg.createRadialGradient(sx, sy, 0, sx, sy, rr); gr.addColorStop(0, `rgba(0,0,0,${k})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); lg.fillStyle = gr; lg.fillRect(sx - rr, sy - rr, rr * 2, rr * 2); };
    fl.lights.forEach(l => hole(l.x, l.y, l.r));
    fl.desks.forEach(d => { const o = d.guest || d.owner; if (o && o.seat === d && o.mode === 'sit') hole(d.sx, d.sy - 6, 26, 0.8); });
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(lightCv, 0, 0);
  }
  // etiquetas (espaço de tela)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = '600 11px system-ui'; ctx.textBaseline = 'middle';
  for (const a of agents) {
    if (a.floor !== view) continue;
    const show = a === selected || z >= 2.6;
    if (!show) continue;
    const sx = ox + a.x * z, sy = oy + (a.y - 27 + (a.mode === 'sit' ? 3 : 0)) * z - 10 - (a.state === 'waiting' && a.mode === 'sit' ? 16 * z : 0);
    const text = a === selected ? a.action : (a.title.length > 24 ? a.title.slice(0, 23) + '…' : a.title);
    const w = Math.min(260, ctx.measureText(text).width) + 22;
    ctx.fillStyle = 'rgba(20,22,40,.85)'; ctx.beginPath(); ctx.roundRect(sx - w / 2, sy - 10, w, 20, 6); ctx.fill();
    ctx.fillStyle = STATES[a.state].color; ctx.fillRect(sx - w / 2 + 7, sy - 3, 6, 6);
    ctx.fillStyle = '#fff'; ctx.fillText(text, sx - w / 2 + 17, sy + 1, 240);
  }
  if (fade > 0) { ctx.fillStyle = `rgba(10,10,20,${fade})`; ctx.fillRect(0, 0, innerWidth, innerHeight); }
}

// ================= navegação =================
function setView(f, keepCam = false) {
  if (f === view || !floors[f]) return;
  view = f; fade = 0.85;
  if (!keepCam) { cam.x = MW * T / 2; cam.y = MH * T / 2; }
  renderFloorTitle(); renderBuilding();
}
function renderFloorTitle() {
  const fl = floors[view];
  $('ftSw').style.background = fl.lobby ? '#1d2433' : fl.company.color;
  $('ftName').textContent = fl.lobby ? 'TÉRREO · RECEPÇÃO' : `${fl.f}º ANDAR · ${fl.company.name.toUpperCase()}`;
  $('ftSpec').textContent = fl.lobby ? 'Entrada do prédio e livro de registro' : fl.company.spec;
  $('fDown').disabled = view === 0; $('fUp').disabled = view === floors.length - 1;
}
$('fUp').onclick = () => { follow = null; setView(Math.min(floors.length - 1, view + 1)); };
$('fDown').onclick = () => { follow = null; setView(Math.max(0, view - 1)); };

let drag = null, moved = false;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; moved = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 4) { moved = true; follow = null; cv.classList.add('drag'); }
    if (moved) { cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; }
  } else cv.classList.toggle('hover', !!agentAt(e.clientX, e.clientY));
});
cv.addEventListener('pointerup', e => {
  cv.classList.remove('drag');
  if (drag && !moved) { const a = agentAt(e.clientX, e.clientY); if (a) { selected = a; follow = a; renderAgentPanel(); } }
  drag = null;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const before = toWorld(e.clientX, e.clientY);
  cam.z = Math.max(1.2, Math.min(7, cam.z * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  const after = toWorld(e.clientX, e.clientY);
  cam.x += before.x - after.x; cam.y += before.y - after.y;
}, { passive: false });
function agentAt(sx, sy) {
  const w = toWorld(sx, sy);
  let best = null;
  for (const a of agents) {
    if (a.floor !== view) continue;
    const top = a.y - 26 + (a.mode === 'sit' ? 3 : 0);
    if (w.x > a.x - 9 && w.x < a.x + 9 && w.y > top && w.y < a.y + (a.mode === 'sit' ? -4 : 2)) if (!best || a.y > best.y) best = a;
  }
  return best;
}
$('zIn').onclick = () => cam.z = Math.min(7, cam.z * 1.25);
$('zOut').onclick = () => cam.z = Math.max(1.2, cam.z / 1.25);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { selected = null; follow = null; renderAgentPanel(); cam.z = fitZoom(); cam.x = MW * T / 2; cam.y = MH * T / 2; }
  if (e.key === 'PageUp') $('fUp').click();
  if (e.key === 'PageDown') $('fDown').click();
});

// ================= painéis =================
$('legend').innerHTML = Object.values(STATES).map(s => `<span><i style="background:${s.color}"></i>${s.label.replace(/^\S+\s/, '')}</span>`).join('');
const collabs = [];
let obra = null;
function renderBuilding() {

  $('floorsList').innerHTML = list.map(fl => {
    const ag = agents.filter(a => !fl.lobby && a.company === fl.company);
    const link = collabs.find(c => c.from === fl.f || c.to === fl.f);

    return `<div class="${cls}" data-f="${fl.f}" style="${link ? '--lc:' + link.color : ''}">
      <span class="num px">${fl.lobby ? 'T' : fl.f + 'º'}</span><span class="sw" style="background:${fl.lobby ? '#8a90ad' : fl.company.color}"></span>
      <span class="nm">${obra === fl.f ? 'EM OBRA…' : esc(fl.lobby ? 'Recepção' : fl.company.name)}</span>
      <span class="pips">${ag.map(a => `<i style="background:${STATES[a.state].color}" title="${esc(a.title)}"></i>`).join('')}</span></div>`;
  }).join('') + '<div id="shaft"></div>';
}
$('floorsList').addEventListener('click', e => { const r = e.target.closest('.fl'); if (r) { follow = null; setView(+r.dataset.f); } });
function updateShaftDots() {
  const shaft = $('shaft'); if (!shaft) return;
  const moving = agents.filter(a => a.transit);
  while (shaft.children.length < moving.length) { const d = document.createElement('div'); d.className = 'td'; shaft.appendChild(d); }
  [...shaft.children].forEach((d, i) => {
    const a = moving[i]; if (!a) { d.style.display = 'none'; return; }
    const rowY = f => { const r = $('floorsList').querySelector(`.fl[data-f="${f}"]`); return r ? r.offsetTop + r.offsetHeight / 2 - 5 : 0; };
    const p = Math.min(1, (performance.now() - a.transit.t0) / a.transit.dur);
    d.style.display = 'block'; d.style.top = (rowY(a.transit.from) + (rowY(a.transit.to) - rowY(a.transit.from)) * p) + 'px'; d.style.background = a.company.color;
  });
}
function renderAgentPanel() {
  const el = $('agent');
  if (!selected) { el.style.display = 'none'; return; }
  const a = selected, s = STATES[a.state];
  const where = a.floor === null ? 'no elevador' : a.floor === 0 ? 'na recepção' : a.floor !== a.homeFloor ? 'visitando ' + floors[a.floor].company.name : '';
  el.style.display = 'block';
  el.innerHTML = `<div class="hd"><span class="sw" style="background:${a.company.color}"></span><div><small class="px">${esc(a.company.name.toUpperCase())}</small><b>Sessão do Claude Code</b></div><button data-x="close">✕</button></div>
  <h3>${esc(a.title)}</h3><span class="st"><i style="background:${s.color}"></i>${s.label}</span>${where ? ` <span class="st">📍 ${esc(where)}</span>` : ''}
  <div class="act">› ${esc(a.action)}</div>
  <div class="msgs"><small class="px">ÚLTIMAS MENSAGENS</small>${a.msgs.map(m => `<div class="msg ${m.u ? 'u' : 'a'}">${esc(m.t)}</div>`).join('')}</div>
  <div class="row"><button data-x="follow">🎯 Seguir</button>${a.consulting ? '<button class="danger" data-x="back">↩ Mandar de volta</button>' : ''}</div>`;

$('agent').addEventListener('click', e => {
  const x = e.target.dataset.x; if (!x) return;
  if (x === 'close') { selected = null; follow = null; renderAgentPanel(); }

  if (x === 'back' && selected) selected.cancel = true;
});
function toast(title, body, actions = []) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<b>${title}</b>${body}${actions.length ? '<div class="row">' + actions.map((a, i) => `<button data-i="${i}" class="${a.primary ? 'primary' : ''}">${a.label}</button>`).join('') + '</div>' : ''}`;
  t.addEventListener('click', e => { const i = e.target.dataset.i; if (i !== undefined) { actions[i].fn && actions[i].fn(); t.remove(); } });
  $('toasts').prepend(t);
  if (!actions.length) setTimeout(() => t.remove(), 7000);
}
function modal(title, body, actions, onOpen) {
  return new Promise(res => {
    $('dialog').innerHTML = `<h2 class="px">${title}</h2><div class="body">${body}</div><div class="actions">${actions.map((a, i) => `<button data-i="${i}" class="${a.primary ? 'primary' : ''}">${a.label}</button>`).join('')}</div>`;
    $('overlay').style.display = 'flex';
    onOpen && onOpen($('dialog'));
    $('dialog').onclick = e => { const i = e.target.dataset.i; if (i !== undefined) { const v = typeof actions[i].value === 'function' ? actions[i].value() : actions[i].value; $('overlay').style.display = 'none'; res(v); } };
  });
}

// ================= comandos =================
function companiesInText(text) {
  const t = text.toLowerCase();
  return COMPANIES.map(c => ({ c, i: t.indexOf(c.name.toLowerCase()) })).filter(x => x.i >= 0).sort((a, b) => a.i - b.i).map(x => x.c);
}
async function runCommand(text) {
  if (!text.trim()) return;
  const named = companiesInText(text);
  let helper, req;
  if (named.length >= 2) { helper = named[0]; req = named[1]; }
  else {
    req = named[0] || COMPANIES.find(c => c.name === 'Conteudo-May') || COMPANIES[0];
    const t = text.toLowerCase();
    helper = COMPANIES.filter(c => c !== req).map(c => ({ c, s: c.kw.filter(k => t.includes(k)).length })).sort((a, b) => b.s - a.s)[0]?.c;
  }
  if (!helper || helper === req) helper = COMPANIES.find(c => c !== req);
  let kind = /pergunt|como |\?|quais|qual /i.test(text) ? 'pergunta' : 'consultoria';
  const opt = sel => COMPANIES.map(c => `<option ${c === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const body = `<div class="quote">“${esc(text)}”</div>
    <label class="px">QUEM PRECISA DE AJUDA</label><select id="mReq">${opt(req)}</select>
    <label class="px">ESPECIALISTA SUGERIDO</label><select id="mHelp">${opt(helper)}</select>
    <div class="hint" id="mSpec"></div>
    <label class="px">TIPO DE AJUDA</label><div class="seg"><button data-k="pergunta">📨 Pedir e receber</button><button data-k="consultoria">🤝 Consultoria</button></div>
    <div class="hint" id="mKindHint"></div>`;
  const read = () => ({ req: $('mReq').value, help: $('mHelp').value, kind });
  const res = await modal('CONFIRMAR ORDEM', body, [{ label: 'Cancelar', value: null }, { label: 'Confirmar ordem', primary: true, value: read }], dlg => {
    const seg = dlg.querySelector('.seg');
    const refresh = () => {
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
      $('mSpec').textContent = 'Especialidade: ' + COMPANIES.find(c => c.name === $('mHelp').value).spec;
      $('mKindHint').textContent = kind === 'pergunta' ? 'Só leitura: a especialista pesquisa na pasta dela e manda um memorando. Nenhum arquivo é alterado.' : 'A especialista monta um briefing, vai até o andar de quem pediu e propõe um plano. Ela só mexe nos arquivos depois da sua aprovação.';
    };
    seg.addEventListener('click', e => { if (e.target.dataset.k) { kind = e.target.dataset.k; refresh(); } });
    $('mHelp').addEventListener('change', refresh); refresh();
  });
  if (!res) return;
  req = COMPANIES.find(c => c.name === res.req); helper = COMPANIES.find(c => c.name === res.help);
  if (req === helper) return toast('⚠️ Ordem inválida', 'A empresa que ajuda precisa ser diferente da que pede ajuda.');
  $('cmdIn').value = '';
  log(`Ordem: ${helper.name} → ${req.name} (${res.kind}): “${text}”`);
  res.kind === 'pergunta' ? doPergunta(req, helper, text) : doConsultoria(req, helper, text);
}
function pickHelper(c) {
  const free = agents.filter(a => a.company === c && !a.busy && !a.collab && a.floor === a.homeFloor);
  return free.find(a => a.mode === 'sit') || free[0];
}
async function startCollab(a, req) {
  a.collab = true;
  const link = { from: a.homeFloor, to: req.floor.f, color: a.company.color }; collabs.push(link);
  selected = a; follow = a; setView(a.homeFloor); cam.z = Math.max(cam.z, 3.2); renderAgentPanel();
  if (a.coffee) { a.coffee.by = null; a.coffee = null; }
  if (a.mode !== 'sit') { await a.walkTo(a.home.sx, a.home.sy); a.sitAt(a.home); }
  return link;
}
async function goHome(a, link) {
  a.carry = 'folder'; a.setAction('Voltando para ' + a.company.name);
  await travel(a, a.homeFloor, { x: a.home.sx, y: a.home.sy });
  a.carry = null; a.sitAt(a.home); a.setState('typing');
  a.collab = a.consulting = a.cancel = false;
  collabs.splice(collabs.indexOf(link), 1);
}
async function doPergunta(req, helpC, text) {
  const a = pickHelper(helpC);
  if (!a) return toast('🙁 Ninguém livre', `Todos da ${esc(helpC.name)} estão ocupados agora.`);
  const link = await startCollab(a, req);
  a.setState('reading', 'Pesquisando para ' + req.name);
  await wait(3500);
  a.carry = 'envelope'; a.setAction('Levando resposta para ' + req.name);
  const target = agents.find(x => x.company === req && x.mode === 'sit' && x.floor === req.floor.f);
  const dest = target ? { x: target.home.sx + 22, y: target.home.sy + 2 } : { x: 12 * T, y: 9 * T };
  await travel(a, req.floor.f, dest);
  a.dir = 'left'; a.setAction('Entregando memorando'); await wait(1800); a.carry = null;
  log(`📨 ${helpC.name} respondeu ${req.name}`);
  toast(`📨 Memorando de ${esc(helpC.name)}`, `<div>Para <b style="display:inline">${esc(req.name)}</b>: resposta sobre “${esc(text)}”.<br><span class="dim">(simulação: no app real é a resposta gerada pelo Claude na pasta da ${esc(helpC.name)})</span></div>`,
    [{ label: 'Encaminhar para a sessão', primary: true, fn: () => { if (target) target.setState('reading', 'Lendo memorando de ' + helpC.name); toast('✅ Encaminhado', `Memorando enviado para “${esc(target ? target.title : req.name)}”.`); } }, { label: 'Fechar' }]);
  await goHome(a, link);
}
async function doConsultoria(req, helpC, text) {
  const a = pickHelper(helpC);
  if (!a) return toast('🙁 Ninguém livre', `Todos da ${esc(helpC.name)} estão ocupados agora.`);
  const link = await startCollab(a, req);
  a.consulting = true;
  a.setState('reading', 'Montando briefing para ' + req.name);
  await wait(4000);
  a.carry = 'folder'; a.setAction('Indo até ' + req.name);
  const desk = req.floor.desks.find(d => !d.owner && !d.guest);
  if (desk) desk.guest = a;
  await travel(a, req.floor.f, desk ? { x: desk.sx, y: desk.sy } : { x: 12 * T, y: 9 * T });
  a.carry = null;
  if (desk) a.sitAt(desk);
  a.setState('waiting', 'Plano pronto — aguardando aprovação');
  log(`🤝 ${helpC.name} chegou em ${req.name} para consultoria`);
  const ok = a.cancel ? false : await modal(`PLANO · ${esc(helpC.name.toUpperCase())} → ${esc(req.name.toUpperCase())}`,
    `<div class="quote">“${esc(text)}”</div><ol>
      <li>Usar o briefing da ${esc(helpC.name)} (${esc(helpC.spec.toLowerCase())})</li>
      <li>Aplicar na pasta da <b>${esc(req.name)}</b>, e só nela</li>
      <li>Revisar e entregar um resumo do que mudou</li></ol>
      <div class="hint">Simulação. No app real, este é o plano gerado pelo Claude em modo de planejamento, e nada é alterado antes do seu “Aprovar”.</div>`,
    [{ label: 'Recusar', value: false }, { label: '✅ Aprovar plano', primary: true, value: true }]);
  if (ok) {
    log(`✅ Você aprovou o plano de ${helpC.name} em ${req.name}`);
    a.setState('typing', 'Consultoria: ' + text);
    for (let i = 0; i < 120 && !a.cancel; i++) await wait(100);
    if (a.cancel) { toast('↩ Consultor chamado de volta', `${esc(helpC.name)} interrompeu o trabalho em ${esc(req.name)}.`); log(`↩ Consultoria cancelada (${helpC.name} → ${req.name})`); }
    else { toast('✅ Consultoria concluída', `${esc(helpC.name)} terminou em ${esc(req.name)}: 3 arquivos alterados (simulação).`); log(`✅ Consultoria concluída: ${helpC.name} → ${req.name}`); }
  } else { toast('✋ Plano recusado', `${esc(helpC.name)} volta para o andar sem alterar nada.`); log(`✋ Plano recusado (${helpC.name} → ${req.name})`); }
  if (desk) desk.guest = null;
  await goHome(a, link);
}
$('cmdGo').onclick = () => runCommand($('cmdIn').value);
$('cmdIn').addEventListener('keydown', e => { if (e.key === 'Enter') runCommand($('cmdIn').value); });

// ================= andar novo =================
async function buildNewFloor() {
  if (obra !== null) return;
  const [name, color] = NEW_PROJECTS[newIdx % NEW_PROJECTS.length];
  const company = { name: newIdx >= NEW_PROJECTS.length ? name + '-' + (newIdx + 1) : name, color, spec: 'Projeto novo — perfil sendo montado', kw: [] };
  newIdx++;
  const f = floors.length;
  const fl = makeFloor(f, company); company.floor = fl;
  floors.push(fl); obra = f; renderBuilding(); renderFloorTitle();
  toast('📁 Pasta nova detectada', `<code>~/.claude/projects/…${esc(company.name)}</code><br>Construindo o ${f}º andar…`);
  await wait(2600);
  obra = null; COMPANIES.push(company); renderBuilding();
  log(`🏗️ Novo andar ${f}: ${company.name}`);
  const a = new Agent(company, { title: 'Primeira sessão em ' + company.name, state: 'typing', action: 'Chegando ao prédio' }, fl.desks[1], true);
  a.busy = true; selected = a; follow = a; setView(0); cam.z = Math.max(cam.z, 3); renderAgentPanel();
  toast('👋 Primeira agente chegando', `Uma sessão começou em <b style="display:inline">${esc(company.name)}</b>. Acompanhe pela recepção.`);
  await travel(a, f, { x: fl.desks[1].sx, y: fl.desks[1].sy });
  a.sitAt(fl.desks[1]); a.setState('typing', 'Criando CLAUDE.md'); a.busy = false;
}

// ================= init =================
floors.push(makeFloor(0, null));
COMPANIES.forEach((c, i) => { c.floor = makeFloor(i + 1, c); floors.push(c.floor); });
COMPANIES.forEach(c => c.seed.forEach((s, i) => new Agent(c, s, c.floor.desks[[0, 2, 5, 7][i]])));
const recep = { look: newLook('#1d2433'), x: 20 * T, y: 9 * T - 2 };
night = new Date().getHours() >= 18 || new Date().getHours() < 6;
view = COMPANIES.length;
renderFloorTitle(); renderBuilding(); renderAgentPanel();
log('Prédio aberto com ' + COMPANIES.length + ' empresas');
$('bNight').onclick = () => night = !night;
$('bBuild').onclick = buildNewFloor;
$('bLog').onclick = () => modal('LIVRO DE REGISTRO', `<div class="log">${logbook.map(l => `<div><time>${l.time}</time>${esc(l.text)}</div>`).join('')}</div>`, [{ label: 'Fechar', primary: true, value: null }]);

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const t = now / 1000;
  agents.forEach(a => { a.update(dt); a.tick(dt); });
  if (follow) {
    if (follow.floor !== null && follow.floor !== view) setView(follow.floor, true);
    if (follow.floor !== null) { const k = 1 - Math.exp(-6 * dt); cam.x += (follow.x - cam.x) * k; cam.y += (follow.y - 12 - cam.y) * k; }
  }
  cam.x = Math.max(0, Math.min(MW * T, cam.x)); cam.y = Math.max(0, Math.min(MH * T, cam.y));
  fade = Math.max(0, fade - dt * 3);
  render(t);
  updateShaftDots();
  if ((acc += dt) > 0.5) { acc = 0; renderBuilding(); if (selected) renderAgentPanel(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
