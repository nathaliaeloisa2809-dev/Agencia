<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prédio IA — protótipo</title>
<style>
:root{--glass:rgba(255,255,255,.82);--ink:#1d2433;--muted:#6b7385;--accent:#5b7cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#bfe3ff}
canvas{display:block}
.panel{position:fixed;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;box-shadow:0 10px 34px rgba(20,30,60,.2)}
#top{top:16px;left:16px;padding:12px 18px}
#top h1{margin:0;font-size:20px;letter-spacing:.4px}
#top p{margin:2px 0 0;font-size:12px;color:var(--muted)}
#tools{top:16px;right:16px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 32px);justify-content:flex-end}
button{border:0;border-radius:10px;padding:8px 12px;font:600 13px system-ui;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:hover{background:#eef2ff}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:#4a69ea}
button.danger{background:#ffe9e6;color:#b4321f}
#companies{top:96px;left:16px;padding:10px;width:250px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 220px);overflow:auto}
#companies h4{margin:2px 4px 0;font-size:11px;color:var(--muted);letter-spacing:1px}
.card{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#fff;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateX(3px)}
.card .sw{width:12px;height:34px;border-radius:6px;flex:none}
.card b{font-size:14px;display:block}
.card small{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.card .cnt{margin-left:auto;font:700 12px system-ui;background:#eef1f6;border-radius:8px;padding:3px 7px;white-space:nowrap}
#cmd{left:50%;bottom:18px;transform:translateX(-50%);width:min(720px,calc(100% - 32px));padding:9px;display:flex;gap:8px;align-items:center}
#cmd input{flex:1;min-width:0;border:0;background:#fff;border-radius:10px;padding:11px 14px;font:14px system-ui;outline:none}
#cmd .tag{font:700 11px system-ui;color:#fff;background:#1d2433;border-radius:8px;padding:6px 8px;white-space:nowrap}
#agent{right:16px;top:76px;width:310px;padding:16px;display:none}
#agent .hd{display:flex;align-items:center;gap:10px}
#agent .hd .sw{width:10px;height:30px;border-radius:5px}
#agent .hd small{display:block;font-size:11px;color:var(--muted);letter-spacing:.8px}
#agent .hd button{margin-left:auto;padding:4px 10px}
#agent h3{margin:12px 0 6px;font-size:16px}
.st{display:inline-flex;align-items:center;gap:6px;font:700 12px system-ui;padding:4px 9px;border-radius:999px;background:#fff}
.st i{width:8px;height:8px;border-radius:50%}
#agent .act{margin:10px 0;font:13px ui-monospace,Consolas,monospace;background:#1d2433;color:#e7ecff;padding:9px 10px;border-radius:10px}
.msgs{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.msgs small{color:var(--muted);font-size:11px;letter-spacing:.8px}
.msg{font-size:13px;padding:7px 10px;border-radius:12px;max-width:88%}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff}
.msg.a{align-self:flex-start;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
#legend{left:16px;bottom:18px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:4px}
#legend span{display:flex;align-items:center;gap:6px}
#legend i{width:8px;height:8px;border-radius:50%}
#overlay{position:fixed;inset:0;background:rgba(15,20,35,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.dialog{background:#fff;border-radius:18px;padding:20px;width:min(460px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog h2{margin:0 0 12px;font-size:18px}
.dialog .body{font-size:14px;line-height:1.5}
.dialog .body label{display:block;font-size:11px;color:var(--muted);letter-spacing:.8px;margin-top:10px}
.dialog select{width:100%;padding:9px;border-radius:10px;border:1px solid #dde2ec;font:14px system-ui;margin-top:4px}
.dialog .seg{display:flex;gap:6px;margin-top:4px}
.dialog .seg button{flex:1;background:#f1f3f8;box-shadow:none}
.dialog .seg button.on{background:var(--accent);color:#fff}
.dialog .hint{font-size:12px;color:var(--muted);margin-top:6px}
.dialog ol{padding-left:20px;margin:8px 0}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.log{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.log div{font-size:13px;background:#f5f7fb;border-radius:10px;padding:7px 10px}
.log time{color:var(--muted);font-size:11px;margin-right:6px}
#toasts{position:fixed;right:16px;bottom:86px;display:flex;flex-direction:column;gap:8px;width:min(330px,calc(100% - 32px));z-index:5}
.toast{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(20,30,60,.22);font-size:13px;line-height:1.45;animation:in .3s ease}
.toast b{display:block;margin-bottom:2px}
.toast .row{margin-top:8px}
.toast button{padding:6px 10px;font-size:12px}
@keyframes in{from{transform:translateY(12px);opacity:0}}
@media (max-width:820px){#companies,#legend{display:none}#agent{left:16px;right:16px;width:auto;top:auto;bottom:86px}}
</style>
</head>
<body>
<div id="top" class="panel"><h1>🏢 Prédio IA</h1><p>Protótipo visual · dados de exemplo</p></div>
<div id="tools" class="panel">
  <button id="bOverview">🏙️ Visão geral</button>
  <button id="bNight">🌙 Dia / Noite</button>
  <button id="bLog">📖 Livro de registro</button>
  <button id="bBuild" class="primary">＋ Simular pasta nova</button>
</div>
<div id="companies" class="panel"></div>
<div id="legend" class="panel"></div>
<div id="agent" class="panel"></div>
<div id="cmd" class="panel">
  <span class="tag">COMANDO</span>
  <input id="cmdIn" placeholder='Ex: "Skills, ajude a Conteudo-May a criar uma skill de posts"' autocomplete="off">
  <button id="cmdGo" class="primary">Enviar</button>
</div>
<div id="toasts"></div>
<div id="overlay"><div class="dialog" id="dialog"></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- layout ----------
const W = 16, D = 10, H = 3.2, SLAB = 0.2;
const floorY = f => f * H + SLAB;
const EX = 9.3, EZ = 1.5;              // elevator car
const DOOR = { x: 7.2, z: 1.5 }, AISLE = 0.8, SEATZ = -1.3;
const DESK_X = [-3.6, -1.0, 1.6, 4.2];
const COFFEE = [{ x: -6.5, z: -3.0, r: 0.6 }, { x: -5.5, z: -2.6, r: -0.5 }];
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- data (exemplo) ----------
const STATES = {
  typing:   { label: '✍️ Escrevendo',     color: '#5b7cff', actions: ['Editando roteiros/semana-46.md', 'Escrevendo src/app.tsx', 'Criando SKILL.md', 'Ajustando estilos.css', 'Escrevendo legendas.md'] },
  reading:  { label: '📖 Lendo',          color: '#a77bff', actions: ['Lendo briefing-cliente.pdf', 'Buscando "hashtags" no projeto', 'Lendo README.md', 'Analisando dados.csv'] },
  terminal: { label: '⌨️ Terminal',       color: '#22b07d', actions: ['Rodando npm test', 'git status', 'python gerar_posts.py', 'npm run build'] },
  waiting:  { label: '❗ Esperando você', color: '#f5a400', actions: ['Esperando sua aprovação', 'Pergunta: posso publicar?', 'Precisa de uma decisão sua'] },
  idle:     { label: '☕ Pausa',           color: '#9aa3b2', actions: ['Parado há 6 min — pausa para o café'] },
};
const COMPANIES = [
  { name: 'Anti', color: '#22b07d', spec: 'Automação e scripts', kw: ['automa', 'script', 'python', 'dados', 'planilha', 'backup'],
    seed: [{ title: 'Script de backup diário', state: 'terminal' }, { title: 'Limpeza da planilha de leads', state: 'reading' }] },
  { name: 'Skills', color: '#5b7cff', spec: 'Cria e organiza skills do Claude', kw: ['skill', 'agente', 'claude', 'prompt', 'organiz'],
    seed: [{ title: 'Skill de posts para Instagram', state: 'typing' }, { title: 'Revisão das skills antigas', state: 'reading' }] },
  { name: 'Conteudo-May', color: '#ff7a59', spec: 'Conteúdo e redes sociais', kw: ['post', 'conteúdo', 'conteudo', 'instagram', 'reels', 'legenda', 'roteiro'],
    seed: [{ title: 'Roteiro dos reels da semana', state: 'typing' }, { title: 'Legendas do Instagram', state: 'reading' }, { title: 'Calendário editorial', state: 'waiting' }] },
];
const NEW_PROJECTS = [['Loja-Online', '#e85d9a'], ['App-Fitness', '#f2b000'], ['Agencia-X', '#00a8c0'], ['Financas', '#8e6bff']];
let newIdx = 0;
const logbook = [];
function log(text) { logbook.unshift({ time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }), text }); }

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
camera.position.set(60, 40, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.5;
controls.minDistance = 3;
controls.maxDistance = 90;
controls.target.set(0, 5, 0);

// ---------- helpers ----------
const MATS = {};
function mat(color, opts = {}) {
  const k = color + JSON.stringify(opts);
  return MATS[k] ??= new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0, ...opts });
}
function mesh(geo, m, x = 0, y = 0, z = 0, parent) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  o.castShadow = o.receiveShadow = true;
  parent && parent.add(o);
  return o;
}
const box = (w, h, d, m, x, y, z, p, r = 0) => mesh(r ? new RoundedBoxGeometry(w, h, d, 2, r) : new THREE.BoxGeometry(w, h, d), m, x, y, z, p);
const cyl = (rt, rb, h, m, x, y, z, p, seg = 16) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y, z, p);
const sph = (r, m, x, y, z, p, seg = 16) => mesh(new THREE.SphereGeometry(r, seg, Math.max(8, (seg * 0.75) | 0)), m, x, y, z, p);
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  t.userData = { ctx, w, h };
  return t;
}
function plane(w, h, tex, x, y, z, p, opts = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false, ...opts }));
  m.position.set(x, y, z); p && p.add(m); return m;
}
const tweens = [];
const ease = e => e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
function tween(ms, fn) { return new Promise(res => tweens.push({ t0: performance.now(), ms, fn, res })); }

// ---------- sky / lights ----------
const skyDay = canvasTex(4, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#5aa9f5'); g.addColorStop(0.55, '#bfe3ff'); g.addColorStop(1, '#fff1da'); c.fillStyle = g; c.fillRect(0, 0, w, h); });
const skyNight = canvasTex(4, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#070c22'); g.addColorStop(0.6, '#1a2552'); g.addColorStop(1, '#3d3a6b'); c.fillStyle = g; c.fillRect(0, 0, w, h); });
scene.fog = new THREE.Fog('#cfe8ff', 70, 200);
const hemi = new THREE.HemisphereLight('#ffffff', '#88a274', 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3df', 2.6);
sun.position.set(20, 34, 26); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 120 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const ceilMat = new THREE.MeshStandardMaterial({ color: '#ffffff', emissive: '#fff4dc', emissiveIntensity: 0.6 });
const winMat = new THREE.MeshStandardMaterial({ color: '#9cc7e8', emissive: '#ffd08a', emissiveIntensity: 0, roughness: 0.15 });
const lampMat = new THREE.MeshStandardMaterial({ color: '#fff7d6', emissive: '#ffd27a', emissiveIntensity: 0 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: '#cfeaff', transparent: true, opacity: 0.25, roughness: 0.05, depthWrite: false });
const pointLights = [];

// ---------- ground / plaza ----------
const ground = mesh(new THREE.PlaneGeometry(400, 400), mat('#a3d48a'), 0, -0.06, 0, scene);
ground.rotation.x = -Math.PI / 2;
box(36, 0.06, 28, mat('#e6dfd4'), 0, -0.03, 1, scene);
box(4, 0.06, 60, mat('#d8cfc1'), 0, -0.025, 30, scene);
function tree(x, z, s = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
  cyl(0.12, 0.16, 1.2, mat('#8a5a3b'), 0, 0.6, 0, g, 8);
  const greens = ['#5fae5a', '#6cc06a', '#4f9c52'];
  [[0, 1.7, 0, 0.8], [0.35, 1.5, 0.2, 0.55], [-0.3, 2.1, -0.1, 0.55]].forEach(([a, b, c, r], i) =>
    mesh(new THREE.IcosahedronGeometry(r, 0), mat(greens[i], { flatShading: true }), a, b, c, g));
}
[[-14, 9], [-15.5, 4], [14, 9], [15.5, 3.5], [-13, -9], [13, -10], [-6, 13], [6, 13], [-20, 14], [21, 15], [-24, -2], [25, -4], [-3, -15], [9, -16]]
  .forEach(([x, z], i) => tree(x, z, 0.9 + (i % 3) * 0.2));
const lamps = [];
[[-3.5, 10], [3.5, 10], [-3.5, 18], [3.5, 18], [-11, 7], [11, 7]].forEach(([x, z]) => {
  cyl(0.06, 0.08, 3, mat('#3b4150'), x, 1.5, z, scene, 8);
  lamps.push(sph(0.22, lampMat, x, 3.1, z, scene, 12));
});
[[-6, 9], [6, 9]].forEach(([x, z]) => {
  box(1.8, 0.1, 0.5, mat('#b07a4f'), x, 0.45, z, scene); box(1.8, 0.4, 0.08, mat('#b07a4f'), x, 0.7, z + 0.25, scene);
  box(0.08, 0.45, 0.4, mat('#3b4150'), x - 0.8, 0.22, z, scene); box(0.08, 0.45, 0.4, mat('#3b4150'), x + 0.8, 0.22, z, scene);
});
const clouds = [];
for (let i = 0; i < 9; i++) {
  const g = new THREE.Group(); g.position.set(-90 + i * 22, 26 + Math.random() * 12, -40 - Math.random() * 40); scene.add(g);
  for (let j = 0; j < 4; j++) { const s = sph(2 + Math.random() * 1.6, mat('#ffffff', { flatShading: true }), j * 2.4 - 3.6, Math.random(), Math.random(), g, 7); s.castShadow = false; }
  clouds.push(g);
}

// ---------- screens ----------
function drawCode(c, w, h, bg, pal) {
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  for (let y = 8; y < h - 6; y += 9) {
    let x = 8 + ((Math.random() * 3) | 0) * 10;
    const n = 1 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n && x < w - 10; i++) { const len = 10 + Math.random() * 40; c.fillStyle = pick(pal); c.fillRect(x, y, len, 4); x += len + 6; }
  }
}
const SCREEN = {
  typing: [0, 1].map(() => canvasTex(160, 100, (c, w, h) => drawCode(c, w, h, '#1e2540', ['#7aa2ff', '#ff9f7a', '#9be38f', '#e7e9f0', '#c792ea']))),
  terminal: [0, 1].map(() => canvasTex(160, 100, (c, w, h) => drawCode(c, w, h, '#07100b', ['#39d98a', '#2fae6f', '#a6f5c8']))),
  reading: [canvasTex(160, 100, (c, w, h) => { c.fillStyle = '#f4f6fb'; c.fillRect(0, 0, w, h); c.fillStyle = '#5b7cff'; c.fillRect(20, 8, 60, 6); c.fillStyle = '#c7cdd9'; for (let y = 22; y < h - 8; y += 8) c.fillRect(20, y, w - 40 - Math.random() * 40, 3); })],
  waiting: [canvasTex(160, 100, (c, w, h) => { c.fillStyle = '#1e2540'; c.fillRect(0, 0, w, h); c.fillStyle = '#ffc233'; c.beginPath(); c.roundRect(40, 22, 80, 56, 10); c.fill(); c.fillStyle = '#1e2540'; c.font = 'bold 40px system-ui'; c.textAlign = 'center'; c.fillText('?', 80, 65); })],
  off: canvasTex(160, 100, (c, w, h) => { c.fillStyle = '#12151c'; c.fillRect(0, 0, w, h); c.fillStyle = '#2a3142'; c.beginPath(); c.arc(80, 50, 12, 0, 7); c.fill(); }),
};

// ---------- building ----------
const building = new THREE.Group(); scene.add(building);
const floors = [];

function fascia(g, label) {
  box(W + 0.4, 0.42, 0.1, mat('#ffffff'), 0, H - 0.21, D / 2 + 0.15, g);
  const tex = canvasTex(1024, 96, () => {});
  plane(5.6, 0.525, tex, -W / 2 + 3.1, H - 0.21, D / 2 + 0.205, g);
  return tex;
}
function shellWalls(g, wallColor) {
  const wh = H - SLAB;
  box(W, wh, 0.2, mat('#f5f0e9'), 0, SLAB + wh / 2, -D / 2 + 0.1, g);
  box(0.2, wh, D, mat('#efe8df'), -W / 2 + 0.1, SLAB + wh / 2, 0, g);
  box(0.04, 1.1, D - 2, winMat, -W / 2 - 0.02, SLAB + 1.7, 0, g);
  box(W, 0.16, 0.22, mat(wallColor), 0, SLAB + 1.05, -D / 2 + 0.1, g);
  box(0.06, wh, 5.9, glassMat, W / 2 - 0.03, SLAB + wh / 2, -2.05, g).castShadow = false;
  box(0.06, wh, 2.9, glassMat, W / 2 - 0.03, SLAB + wh / 2, 3.55, g).castShadow = false;
  [-4.95, -2.5, 0.9, 2.1, 4.95].forEach(z => box(0.1, wh, 0.1, mat('#d9dde3'), W / 2 - 0.03, SLAB + wh / 2, z, g));
  box(0.5, SLAB, 1.6, mat('#d9dde3'), W / 2 + 0.2, SLAB / 2, EZ, g); // elevator landing
  [-4, 0, 4].forEach(x => box(2.2, 0.04, 0.5, ceilMat, x, H - 0.03, -1, g).castShadow = false);
  const pl = new THREE.PointLight('#ffe2b8', 6, 16, 1.6); pl.position.set(0, H - 0.6, 0); g.add(pl); pointLights.push(pl);
}
function plant(g, x, z, s = 1) {
  cyl(0.22 * s, 0.17 * s, 0.4 * s, mat('#c86f4b'), x, SLAB + 0.2 * s, z, g, 12);
  mesh(new THREE.IcosahedronGeometry(0.42 * s, 0), mat('#5fae5a', { flatShading: true }), x, SLAB + 0.7 * s, z, g);
  mesh(new THREE.IcosahedronGeometry(0.3 * s, 0), mat('#4f9c52', { flatShading: true }), x + 0.15 * s, SLAB + 1.0 * s, z - 0.1, g);
}

function buildOfficeFloor(f, company) {
  const g = new THREE.Group(); g.position.y = f * H; building.add(g);
  const tint = '#' + new THREE.Color(company.color).lerp(new THREE.Color('#ffffff'), 0.72).getHexString();
  box(W + 0.4, SLAB, D + 0.4, mat('#eeeae4'), 0, SLAB / 2, 0, g);
  box(W + 0.42, 0.05, D + 0.42, mat(company.color), 0, SLAB - 0.03, 0, g);
  box(W - 0.3, 0.02, D - 0.3, mat(tint), 0, SLAB + 0.01, 0, g);
  shellWalls(g, company.color);

  const desks = DESK_X.map((x, i) => {
    const d = new THREE.Group(); d.position.set(x, SLAB, -2.2); g.add(d);
    box(1.5, 0.06, 0.8, mat('#f7f3ec'), 0, 0.75, 0, d, 0.02);
    box(0.06, 0.72, 0.7, mat('#c9c3ba'), -0.68, 0.36, 0, d); box(0.06, 0.72, 0.7, mat('#c9c3ba'), 0.68, 0.36, 0, d);

    P.arms.forEach((a, i) => { a.sh.rotation.x = lerp(a.sh.rotation.x, sh[i], k); a.el.rotation.x = lerp(a.el.rotation.x, el[i], k); });
    P.torso.rotation.x = lerp(P.torso.rotation.x, tX, k);
    P.head.rotation.x = lerp(P.head.rotation.x, hX, k); P.head.rotation.y = lerp(P.head.rotation.y, hY, k);
    const it = P.items;
    it.cup.visible = this.mode === 'stand' && st === 'idle' && !this.carry && !this.collab;

async function travel(a, to, dest) {
  a.standUp();
  const p = a.g.position;
  if (a.floor !== to) {
    await a.walkTo([{ x: p.x, z: AISLE }, { x: DOOR.x, z: AISLE }, { x: DOOR.x, z: DOOR.z }]);
    await withElevator(async () => {
      await moveCar(a.floor);
      a.riding = true;
      await a.walkTo([{ x: EX - 0.2, z: EZ }]);
      await wait(250);
      await moveCar(to);
      a.floor = to;
      await a.walkTo([{ x: DOOR.x, z: DOOR.z }]);
      a.riding = false;
    });
    await a.walkTo([{ x: DOOR.x, z: AISLE }, { x: dest.x, z: AISLE }, dest]);
  } else {
    await a.walkTo([{ x: p.x, z: AISLE }, { x: dest.x, z: AISLE }, dest]);

}

// ---------- collaboration link ----------
const links = [];
function makeLink(fa, fb, color) {
  const ya = floorY(fa) + 1.5, yb = floorY(fb) + 1.5, x = -W / 2 - 0.3, z = 3;
  const curve = new THREE.CatmullRomCurve3([V(x, ya, z), V(x - 2.2, (ya + yb) / 2, z + 0.5), V(x, yb, z)]);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.06, 8), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.75, toneMapped: false }));
  scene.add(tube);
  const dots = Array.from({ length: 8 }, () => { const s = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), new THREE.MeshBasicMaterial({ color: '#ffffff', toneMapped: false })); scene.add(s); return s; });
  const link = {
    update(t) { tube.material.opacity = 0.55 + Math.sin(t * 4) * 0.25; dots.forEach((d, i) => d.position.copy(curve.getPointAt((t * 0.25 + i / dots.length) % 1))); },
    dispose() { scene.remove(tube); dots.forEach(d => scene.remove(d)); links.splice(links.indexOf(link), 1); },
  };
  links.push(link);
  return link;
}

  const seg = $('dialog').querySelector('.seg');

    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
    const h = COMPANIES.find(c => c.name === $('mHelp').value);
    $('mSpec').textContent = 'Especialidade: ' + h.spec;

  };

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  for (const hit of ray.intersectObjects(scene.children, true)) {

    if (!found) continue;

  }
});

const clock = new THREE.Clock();

  if (elev.target !== null) {

  links.forEach(l => l.update(t));
  if ((screenAcc += dt) > 0.3) {
    screenAcc = 0;
    floors.forEach(fl => fl.desks.forEach(d => { const o = d.guest || d.owner; if (o && o.seat === d && (o.state === 'typing' || o.state === 'terminal')) d.screen.material.map = SCREEN[o.state][d.v ^= 1]; }));
  }
  if ((acc += dt) > 0.5) { acc = 0; updateSigns(); renderCompanies(); if (selected) renderAgentPanel(); }
  beacon.visible = Math.sin(t * 3) > 0;
  clouds.forEach(c => { c.position.x += dt * 0.8; if (c.position.x > 110) c.position.x = -110; });
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
